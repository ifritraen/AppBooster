name: Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Prepare signing keystore
        env:
          PS_RELEASE_KEY_FILE: ${{ secrets.PS_RELEASE_KEY_FILE }}
          PS_RELEASE_KEY_ALIAS: ${{ secrets.PS_RELEASE_KEY_ALIAS }}
          PS_RELEASE_KEY_PASSWORD: ${{ secrets.PS_RELEASE_KEY_PASSWORD }}
          PS_RELEASE_STORE_PASSWORD: ${{ secrets.PS_RELEASE_STORE_PASSWORD }}
        run: |
          if [ -n "$PS_RELEASE_KEY_FILE" ]; then
            keystore_path="$RUNNER_TEMP/release-keystore.jks"
            echo "$PS_RELEASE_KEY_FILE" | base64 --decode > "$keystore_path"
            key_password="${PS_RELEASE_KEY_PASSWORD:-$PS_RELEASE_STORE_PASSWORD}"
            {
              echo "GH_RELEASE_KEYSTORE_PATH=$keystore_path"
              echo "GH_RELEASE_KEY_ALIAS=$PS_RELEASE_KEY_ALIAS"
              echo "GH_RELEASE_KEY_PASSWORD=$key_password"
              echo "GH_RELEASE_STORE_PASSWORD=$PS_RELEASE_STORE_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Extract Version
        id: get_version
        run: |
          MAJOR=$(grep -oP 'val major\s*=\s*\K\d+' app/build.gradle.kts || echo "1")
          MINOR=$(grep -oP 'val minor\s*=\s*\K\d+' app/build.gradle.kts || echo "0")
          PATCH=$(grep -oP 'val patch\s*=\s*\K\d+' app/build.gradle.kts || echo "0")
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "Building OptiDroid version: ${VERSION_NAME}"

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/OptiDroid-v${{ steps.get_version.outputs.VERSION_NAME }}-debug.apk || true
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/OptiDroid-v${{ steps.get_version.outputs.VERSION_NAME }}-release.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/OptiDroid-v${{ steps.get_version.outputs.VERSION_NAME }}-release.apk
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OptiDroid-APKs
          path: artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION_NAME }}
          name: OptiDroid v${{ steps.get_version.outputs.VERSION_NAME }}
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
